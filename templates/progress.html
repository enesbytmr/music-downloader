<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 İndirme Durumu - Music Downloader</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }
        .header-section {
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            border-radius: 20px 20px 0 0;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .progress {
            height: 20px;
            border-radius: 10px;
            background-color: #e9ecef;
        }
        .progress-bar {
            border-radius: 10px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }
        .status-card {
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            transition: transform 0.3s ease;
        }
        .status-card:hover {
            transform: translateY(-2px);
        }
        .log-container {
            background: #2d3748;
            color: #e2e8f0;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            max-height: 400px;
            overflow-y: auto;
        }
        .log-container::-webkit-scrollbar {
            width: 8px;
        }
        .log-container::-webkit-scrollbar-track {
            background: #4a5568;
            border-radius: 4px;
        }
        .log-container::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }
        .spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .btn-home {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 10px;
            color: white;
            transition: transform 0.3s ease;
        }
        .btn-home:hover {
            transform: translateY(-2px);
            color: white;
        }
        
        .nav-menu {
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 15px -20px -20px -20px;
            padding: 15px 20px;
            border-radius: 0 0 15px 15px;
        }
        
        .nav-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 8px 16px;
            margin: 0 5px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            text-decoration: none;
            transform: translateY(-2px);
        }
        
        .nav-btn.active {
            background: rgba(255, 255, 255, 0.9);
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="main-container">
                    <!-- Header -->
                    <div class="header-section p-4 text-center">
                        <h1 class="mb-2">
                            <i class="fas fa-download"></i> İndirme Durumu
                        </h1>
                        <p class="mb-3 fs-6">Playlist'iniz indiriliyor...</p>
                        
                        <!-- Navigation Menu -->
                        <div class="nav-menu">
                            <a href="/" class="nav-btn">
                                <i class="fas fa-home"></i> Ana Sayfa
                            </a>
                            <a href="/cookies" class="nav-btn">
                                <i class="fas fa-cookie-bite"></i> Cookie Ayarları
                            </a>
                            <a href="/progress" class="nav-btn active">
                                <i class="fas fa-chart-line"></i> İndirme Durumu
                            </a>
                        </div>
                    </div>
                    
                    <div class="p-4">
                        <!-- Status Cards -->
                        <div class="row mb-4">
                            <div class="col-md-3 mb-3">
                                <div class="status-card p-3 text-center">
                                    <div id="status-icon" class="mb-2">
                                        <i class="fas fa-spinner spinner text-primary" style="font-size: 2rem;"></i>
                                    </div>
                                    <h6 id="status-text">Başlatılıyor...</h6>
                                    <small id="service-type" class="text-muted">Servis algılanıyor</small>
                                </div>
                            </div>
                            <div class="col-md-3 mb-3">
                                <div class="status-card p-3 text-center">
                                    <div class="mb-2">
                                        <i class="fas fa-music text-info" style="font-size: 2rem;"></i>
                                    </div>
                                    <h6>İndirilen</h6>
                                    <strong id="progress-count" class="text-info">0 / 0</strong>
                                </div>
                            </div>
                            <div class="col-md-3 mb-3">
                                <div class="status-card p-3 text-center">
                                    <div class="mb-2">
                                        <i class="fas fa-clock text-warning" style="font-size: 2rem;"></i>
                                    </div>
                                    <h6>Süre</h6>
                                    <strong id="elapsed-time" class="text-warning">00:00</strong>
                                </div>
                            </div>
                            <div class="col-md-3 mb-3">
                                <div class="status-card p-3 text-center">
                                    <div class="mb-2">
                                        <i class="fas fa-percentage text-success" style="font-size: 2rem;"></i>
                                    </div>
                                    <h6>Tamamlanma</h6>
                                    <strong id="completion-percentage" class="text-success">0%</strong>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Progress Bar -->
                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h6 class="mb-0">İndirme İlerlemesi</h6>
                                <small id="current-song" class="text-muted pulse">Hazırlanıyor...</small>
                            </div>
                            <div class="progress">
                                <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" 
                                     role="progressbar" style="width: 0%">
                                    <span id="progress-text">0%</span>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Live Logs -->
                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h6 class="mb-0">
                                    <i class="fas fa-terminal"></i> Canlı Loglar
                                </h6>
                                <button id="clear-logs" class="btn btn-sm btn-outline-secondary">
                                    <i class="fas fa-trash"></i> Temizle
                                </button>
                            </div>
                            <div id="log-container" class="log-container p-3">
                                <div id="logs">İndirme başlatılıyor...</div>
                            </div>
                        </div>
                        
                        <!-- Action Buttons -->
                        <div class="text-center">
                            <a href="/" class="btn btn-home me-2">
                                <i class="fas fa-home"></i> Ana Sayfa
                            </a>
                            <button id="refresh-btn" class="btn btn-outline-primary me-2" onclick="location.reload()">
                                <i class="fas fa-sync-alt"></i> Yenile
                            </button>
                            <button id="open-folder" class="btn btn-outline-success" style="display: none;" onclick="openFolder()">
                                <i class="fas fa-folder-open"></i> Klasörü Aç
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let startTime = new Date();
        let updateInterval;
        let logUpdateInterval;
        
        function updateElapsedTime() {
            const now = new Date();
            const elapsed = Math.floor((now - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            document.getElementById('elapsed-time').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
        
        function updateStatus() {
            fetch('/api/status')
                .then(response => response.json())
                .then(data => {
                    // Status icon ve text
                    const statusIcon = document.getElementById('status-icon');
                    const statusText = document.getElementById('status-text');
                    const serviceType = document.getElementById('service-type');
                    
                    if (data.error) {
                        statusIcon.innerHTML = '<i class="fas fa-exclamation-triangle text-danger" style="font-size: 2rem;"></i>';
                        statusText.textContent = 'Hata Oluştu';
                        serviceType.textContent = data.error;
                        serviceType.className = 'text-danger';
                    } else if (data.completed) {
                        statusIcon.innerHTML = '<i class="fas fa-check-circle text-success" style="font-size: 2rem;"></i>';
                        statusText.textContent = 'Tamamlandı!';
                        serviceType.textContent = 'İndirme başarılı';
                        serviceType.className = 'text-success';
                        document.getElementById('open-folder').style.display = 'inline-block';
                        clearInterval(updateInterval);
                    } else if (data.is_downloading) {
                        statusIcon.innerHTML = '<i class="fas fa-download text-primary pulse" style="font-size: 2rem;"></i>';
                        statusText.textContent = 'İndiriliyor...';
                        serviceType.textContent = data.current_task || 'İndiriliyor';
                        serviceType.className = 'text-primary';
                    }
                    
                    // Progress
                    const progress = data.total > 0 ? Math.round((data.progress / data.total) * 100) : 0;
                    document.getElementById('progress-bar').style.width = progress + '%';
                    document.getElementById('progress-text').textContent = progress + '%';
                    document.getElementById('progress-count').textContent = `${data.progress} / ${data.total}`;
                    document.getElementById('completion-percentage').textContent = progress + '%';
                    document.getElementById('current-song').textContent = data.current_song || 'Hazırlanıyor...';
                })
                .catch(error => {
                    console.error('Status update error:', error);
                });
        }
        
        function updateLogs() {
            fetch('/api/logs')
                .then(response => response.json())
                .then(data => {
                    const logsContainer = document.getElementById('logs');
                    if (data.logs && data.logs.length > 0) {
                        logsContainer.innerHTML = data.logs.map(log => 
                            `<div class="mb-1">${escapeHtml(log)}</div>`
                        ).join('');
                        logsContainer.scrollTop = logsContainer.scrollHeight;
                    }
                })
                .catch(error => {
                    console.error('Logs update error:', error);
                });
        }
        
        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
        
        function openFolder() {
            // macOS için Finder'da klasörü aç
            alert('İndirme tamamlandı! Dosyalar Desktop/Music klasöründe.');
        }
        
        // Clear logs button
        document.getElementById('clear-logs').addEventListener('click', function() {
            document.getElementById('logs').innerHTML = 'Loglar temizlendi...';
        });
        
        // Start intervals
        updateInterval = setInterval(updateStatus, 1000);
        logUpdateInterval = setInterval(updateLogs, 2000);
        setInterval(updateElapsedTime, 1000);
        
        // Initial updates
        updateStatus();
        updateLogs();
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', function() {
            clearInterval(updateInterval);
            clearInterval(logUpdateInterval);
        });
    </script>
</body>
</html>
